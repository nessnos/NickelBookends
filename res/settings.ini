; NickelBookends settings. Toggle them from the reading menu (⋯ in the top
; toolbar): "Physical book pages" and "Hide book titles".

[General]
; Master switch: true / false
enabled=true

; Show the physical page next to Kobo's percentage in the header/footer:
;   The Jasad Crown • 302 OF 671 • 45% READ
physical_pages=true

; Hide book titles in the reading header and footer
hide_title=false

; Text of the page part. Tokens: {page} {total} {left} {percent}
page_format={page} OF {total}

; Write details to nickelbookends.log (only needed for troubleshooting)
debug=false

; Force a page count for every book (0 = use the book's metadata)
override_total=0
