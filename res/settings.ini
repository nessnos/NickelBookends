; NickelBookends settings. Use the reading menu (⋯ in the top toolbar):
;   "Physical book progress"        - toast like "Page 302 of 671"
;   "Physical book pages in footer" - toggles "302 OF 671" next to Kobo's percentage
;   "Hide book titles"              - toggles the book title in the header/footer

[General]
; Master switch: true / false
enabled=true

; Show the physical page next to Kobo's percentage in the header/footer:
;   The Jasad Crown • 302 OF 671 • 45% READ
physical_pages=true

; Hide book titles in the reading header and footer
hide_title=false

; Text of the page part in the footer. Tokens: {page} {total} {left} {percent}
page_format={page} OF {total}

; Text of the progress toast
toast_format=Page {page} of {total}

; Write details to nickelbookends.log (helps with troubleshooting)
debug=true

; Force a page count for every book (0 = use the book's metadata)
override_total=0
